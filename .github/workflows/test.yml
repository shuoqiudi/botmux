name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Serial Gateway packaging, runtime and Go tests
        run: ee/telegram_gateway/test.sh
      - name: Preserved interface smoke
        run: ee/telegram_gateway/smoke.sh
