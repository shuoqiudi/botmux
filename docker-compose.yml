services:
  botmux:
    image: ghcr.io/skrashevich/botmux:main
    container_name: botmux
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - botmux-data:/data
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    command: ["-addr", ":8080", "-db", "/data/botdata.db", "-redis-addr", "redis:6379"]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - botmux-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  botmux-data:
  botmux-redis:
